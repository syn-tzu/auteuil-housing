# Asks the deployed app to check the alert inbox every 30 minutes.
# Vercel's free plan only runs its own scheduled job once a day (see vercel.json), so GitHub
# provides the frequent nudges. Needs two repository secrets: APP_URL and CRON_SECRET.
# Until they exist the job does nothing (and sends no failure emails).
name: Check inbox

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call the app's ingestion endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set yet; skipping (see SETUP.md step 5b)."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/ingest"
